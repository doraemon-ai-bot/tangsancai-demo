            background: rgba(212, 175, 55, 0.3);
        }

        /* Base Museum Card */
        .museum-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(18, 18, 16, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        .museum-card:hover {
            background: rgba(28, 28, 24, 0.6);
            border-color: rgba(212, 175, 55, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        /* Active Museum Card */
        .museum-card-active {
            background: rgba(212, 175, 55, 0.04) !important;
            border-color: rgba(212, 175, 55, 0.7) !important;
            box-shadow: 0 10px 45px rgba(212, 175, 55, 0.12), 0 0 20px rgba(212, 175, 55, 0.03) !important;
            transform: scale(1.02);
        }

        /* Luxury Card Numbering */
        .museum-card-num {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            font-weight: 700;
            color: rgba(212, 175, 55, 0.3);
            width: 20px;
            text-align: center;
            transition: color 0.5s;
        }
        .museum-card-active .museum-card-num {
            color: #d4af37;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        /* Luxury Thumbnails */
        .museum-card-thumb {
            width: 40px;
            height: 56px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.12);
            transition: border-color 0.5s;
        }
        .museum-card-active .museum-card-thumb {
            border-color: rgba(212, 175, 55, 0.6);
        }

        /* Custom Badges */
        .museum-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 8px;
            font-weight: 700;
            margin-top: 6px;
            border: 1px solid rgba(212, 175, 55, 0.12);
            color: rgba(212, 175, 55, 0.5);
            background: rgba(212, 175, 55, 0.01);
            letter-spacing: 0.08em;
            transition: all 0.5s;
        }
        .museum-badge-active {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 8px;
            font-weight: 700;
            margin-top: 6px;
            border: 1px solid rgba(212, 175, 55, 0.35);
            color: #d4af37;
            background: rgba(212, 175, 55, 0.08);
            letter-spacing: 0.08em;
            transition: all 0.5s;
        }
        
        /* Cinematic Curtain Animation */
        #curtainOverlay {
            background: transparent;
            pointer-events: auto;
        }
        .curtain-open {
            pointer-events: none !important;
        }
        .curtain-open #curtainLeft {
            transform: translateX(-100%);
        }
        .curtain-open #curtainRight {
            transform: translateX(100%);
        }
        .curtain-open #curtainBtn {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }
        
        /* Pulse animation for curtain start button */
        @keyframes goldPulse {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }
        #curtainBtn {
            animation: goldPulse 2s infinite;
        }

        (function() {

                function addLogLine(text, colorClass = 'text-gray-300') {
                    // Auto-reveal disabled for production showcase. Console stays permanently hidden.
                    if (consoleDiv) {
                        const line = document.createElement('div');
                        line.className = `${colorClass} leading-tight break-all border-b border-white/5 py-0.5`;
                        line.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;

                        }

                    }
                }
                
                window.copyAllDebugLogs = function() {
                    if (!consoleDiv) return;
                    const lines = Array.from(consoleDiv.children).map(el => el.innerText || el.textContent).join('\n');
                    if (!lines) {
                        showToast("暂无日志可复制", "warning");
                        return;
                    }
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(lines).then(() => {
                            showToast("✅ 已复制全部调试日志到剪贴板！", "success");
                        }).catch(() => fallbackCopyText(lines));
                    } else {
                        fallbackCopyText(lines);
                    }
                };
                
                function fallbackCopyText(text) {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    try {
                        document.execCommand('copy');
                        showToast("✅ 已复制全部调试日志到剪贴板！", "success");
                    } catch (e) {

                    return false;
                };
                
                window.addEventListener('unhandledrejection', function(event) {
                    addLogLine(`[🚨 Unhandled Promise] ${event.reason}`, 'text-red-500');
                });
                
                const originalLog = console.log;
                console.log = function(...args) {
                    originalLog.apply(console, args);
                    addLogLine(args.join(' '), 'text-gray-300');
                };
                
                const originalWarn = console.warn;

        /**

        function playUIChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(550, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1100, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.04, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {
                // AudioContext blocked by user gesture policy
            }
        }

        /**
         * Seamless Double-Buffered Video Player Helper
         */
        function playSeamlessVideo(src, loop = false, blendMode = 'screen', onendedCallback = null) {
            return new Promise((resolve, reject) => {
                const playerA = document.getElementById('videoPlayerA');
                const playerB = document.getElementById('videoPlayerB');
                if (!playerA || !playerB) { 
                    console.error("[Video System 🚨] Missing videoPlayerA or videoPlayerB elements!");
                    resolve(); 
                    return; 
                }
                
                const nextPlayer = (activePlayer === playerA) ? playerB : playerA;
                const prevPlayer = activePlayer;
                
                console.log(`[Video Loading 🎥] Switching source -> ${src} (loop: ${loop}, blend: ${blendMode})`);
                
                // Force immediate visibility on nextPlayer
                nextPlayer.classList.remove('opacity-0');
                nextPlayer.classList.add('opacity-100');
                nextPlayer.style.opacity = '1';
                
                if (!nextPlayer.src.endsWith(src)) {
                    nextPlayer.src = src;
                }
                nextPlayer.loop = loop;
                nextPlayer.style.mixBlendMode = blendMode;
                nextPlayer.currentTime = 0;
                nextPlayer.ontimeupdate = null; // Clear old listeners
                
                // Mute status - standby loop must be muted for Chrome autoplay
                if (src.includes("intro.mp4") || src.includes("0_standby.mp4")) {
                    nextPlayer.muted = true;
                } else {
                    nextPlayer.muted = false;
                }
                
                nextPlayer.onplaying = function() {
                    console.log(`[Video Loading ✅] Video playing & fading in: ${src} (Player: ${nextPlayer.id})`);
                    nextPlayer.classList.remove('opacity-0');
                    nextPlayer.classList.add('opacity-100');
                    
                    if (prevPlayer && prevPlayer !== nextPlayer) {
                        prevPlayer.classList.remove('opacity-100');
                        prevPlayer.classList.add('opacity-0');
                        setTimeout(() => {
                            if (currentState !== AppState.STANDBY_LOOP) {
                                prevPlayer.pause();
                            }
                        }, 300);
                    }
                    nextPlayer.onplaying = null;
                };
                
                // Fallback: If onplaying doesn't fire (e.g. cached/autoplay), force visibility
                setTimeout(() => {
                    nextPlayer.classList.remove('opacity-0');
                    nextPlayer.classList.add('opacity-100');
                    if (prevPlayer && prevPlayer !== nextPlayer) {
                        prevPlayer.classList.remove('opacity-100');
                        prevPlayer.classList.add('opacity-0');
                    }
                }, 500);
                
                if (!loop) {
                    nextPlayer.ontimeupdate = function() {
                        if (nextPlayer.duration > 1.0 && nextPlayer.currentTime > 1.0 && (nextPlayer.ended || nextPlayer.currentTime >= nextPlayer.duration - 0.08)) {
                            nextPlayer.ontimeupdate = null; // One-shot
                            console.log(`[Video Loading 🏁] Video ended: ${src}`);
                            if (onendedCallback) onendedCallback();
                            resolve();
                        }
                    };
                }
                
                activePlayer = nextPlayer;
                nextPlayer.play().then(() => {
                    console.log(`[Video Loading ▶️] Play promise resolved for: ${src}`);
                    if (loop) resolve(); // For looping videos, resolve immediately after play starts
                }).catch(e => {
                    console.warn(`[Video Loading ⚠️] Play failed for ${src} (Autoplay policy?):`, e);
                    // If play fails (e.g. autoplay blocked), resolve anyway to avoid hanging the flow
                    resolve();
                });
            });
        }

                if (isAbsent && window.presenceTimer) {
                    console.log("[State Machine] User left before 5 seconds. Cancelling cinematic trigger.");
                    clearTimeout(window.presenceTimer);
                    window.presenceTimer = null;
                }

                // If user leaves frame, or is still (hands down) for 15 seconds
                if (currentState === AppState.WAITING_FOR_SPIN || currentState === AppState.STANDBY_WAIT) {
                    console.log(`[State Machine] User ${isAbsent ? 'left the scene' : 'is still for 15s'} -> OUTRO_VIDEO`);
                    playOutroVideo();
                }
            };

            window.onUserDetected = function() {
                if (currentState === AppState.STANDBY_LOOP) {
                    if (!window.presenceTimer) {
                        console.log("[State Machine] User detected! Running VLM color match and starting 5s presence countdown...");
                        
                        // Immediately run VLM match and update lower layer image to reveal_{color}_0s.jpg
                        triggerSilentBackgroundMatch().catch(e => console.error("[State Machine] Match failed:", e));

                        window.presenceTimer = setTimeout(() => {
                            if (currentState === AppState.STANDBY_LOOP) {
                                console.log("[State Machine] User presence confirmed for 5 seconds! Auto-starting cinematic flow.");
                                startCinematicFlow();
                            }
                            window.presenceTimer = null;
                        }, 5000);
                    }
                }
            };
            
            window.onUserActive = function() {};

            const matchedId = window.matchedFigurineId || 'white';

                if (promptMat) {

                if (mocap) {

        async function triggerSpinTransition() {
            currentState = AppState.SPIN_LOOPING;
            
            const matchedId = window.matchedFigurineId || 'white';
            const figurine = FIGURINES_DB[matchedId];
            
            let spinVideoSrc = "";
            if (spinVideoIndex === 0) {
                spinVideoSrc = figurine ? figurine.firstSpinVideo : "video/white_to_big.mp4";
            } else {
                spinVideoSrc = SPIN_LOOP_VIDEOS[(spinVideoIndex - 1) % SPIN_LOOP_VIDEOS.length];
            }
            
            console.log(`[State Machine] Playing spin transition video: ${spinVideoSrc}`);
            
            // Fade out the prompt temporarily while the video plays
            const promptMat = document.getElementById('promptMaterialImg');
            if (promptMat) { 
                promptMat.classList.remove('opacity-100'); 
                setTimeout(() => promptMat.classList.add('hidden'), 500);
            }
            
            const showMatPromptCallback = () => {
                if (promptMat) {
                    promptMat.classList.remove('hidden');
                    void promptMat.offsetWidth;
                    promptMat.classList.add('opacity-100');
                }
                
                spinVideoIndex++;
                
                // Continuous Spin Logic: 
                // As long as hands are not put down (isCurrentlySpreadingArms is true)
                const isHolding = mocap && mocap.isCurrentlySpreadingArms;
                
                if (isHolding) {
                    console.log(`[State Machine] Spin loop continues (Holding arms). Playing next.`);
                    triggerSpinTransition(); // Play next
                } else {
                    console.log(`[State Machine] Hands down. Waiting 5s for resume.`);
                    currentState = AppState.WAITING_FOR_SPIN_RESUME;
                    
                    if (mocap) {
                        mocap.activePoseKey = 'spread_arms';
                        mocap.matchStartTime = null;
                        mocap.isPoseTriggerMode = true;
                    }
                    
                    window.spinResumeTimer = setTimeout(() => {
                        if (currentState === AppState.WAITING_FOR_SPIN_RESUME) {
                            console.log(`[State Machine] 5s elapsed without raising hands. Triggering outro.`);
                            playOutroVideo();
                        }
                    }, 5000);
                }
            };
            
            try {
                // Ensure spin videos use screen blending for transparent black background
                await playSeamlessVideo(spinVideoSrc, false, 'screen', showMatPromptCallback);
            } catch (e) {
                console.error("[State Machine] Play failed:", e);
            }
            console.log(`[State Machine] Spin video ${spinVideoIndex} ended. Evaluating next step.`);
        }

        function matchFigurineByColor(color) {
            console.log("[AI Match] Finding matching figurine for color:", color);
            // Search in database
            for (let key in FIGURINES_DB) {
                if (FIGURINES_DB[key].tags && FIGURINES_DB[key].tags.color === color) {
                    return FIGURINES_DB[key];
                }
            }
            // Fallback to white
            return FIGURINES_DB['white'];
        }

        function mapDescriptionToColor(text) {
            const lower = text.toLowerCase();
            
            const colorDefinitions = {
                '红': ['red', 'orange', 'yellow', 'pink', 'brown', '红', '黄', '橙', '褐'],
                '蓝': ['blue', 'green', 'cyan', 'purple', '蓝', '绿', '青', '紫'],
                '黑': ['black', 'dark', '黑'],
                '白': ['white', 'light', '白'],
                '灰': ['gray', 'grey', 'silver', '灰']
            };

            const anchors = ['dressed', 'wearing', 'outfit', 'shirt', 'clothing', 'top', 't-shirt', 'skirt', 'robe', 'garment', 'suit', 'dress', 'clothes', '衣', '衫', '裙', '袍'];
            
            // Find all anchor indices
            const anchorIndices = [];
            anchors.forEach(anchor => {
                let startIndex = 0;
                let idx;
                while ((idx = lower.indexOf(anchor, startIndex)) > -1) {
                    anchorIndices.push(idx);
                    startIndex = idx + anchor.length;
                }
            });

            if (anchorIndices.length === 0) {
                console.warn("[Color Map] No clothing anchors found in description! Using global simple matching.");
                // Fallback to simple matching
                for (let color in colorDefinitions) {
                    for (let kw of colorDefinitions[color]) {
                        if (lower.includes(kw)) return color;
                    }
                }
                return '白'; // Default fallback
            }

            let bestColor = '白';
            let minDistance = 999999;

            for (let color in colorDefinitions) {
                const keywords = colorDefinitions[color];
                keywords.forEach(kw => {
                    let startIndex = 0;
                    let kwIdx;
                    while ((kwIdx = lower.indexOf(kw, startIndex)) > -1) {
                        // Look-ahead filter for modifiers 'dark' and 'light'
                        if (kw === 'dark' || kw === 'light') {
                            const followingText = lower.substring(kwIdx + kw.length, kwIdx + kw.length + 15);
                            let hasOtherColor = false;
                            for (let otherColor in colorDefinitions) {
                                const otherKeywords = colorDefinitions[otherColor];
                                for (let okw of otherKeywords) {
                                    if (okw !== 'dark' && okw !== 'light' && followingText.includes(okw)) {
                                        hasOtherColor = true;
                                        break;
                                    }
                                }
                                if (hasOtherColor) break;
                            }
                            if (hasOtherColor) {
                                console.log("[Color Map] Skipping modifier", kw, "followed by color in:", followingText);
                                startIndex = kwIdx + kw.length;
                                continue;
                            }
                        }

                        // Calculate min distance to any anchor
                        anchorIndices.forEach(aIdx => {
                            const dist = Math.abs(kwIdx - aIdx);
                            if (dist < minDistance) {
                                minDistance = dist;
                                bestColor = color;
                                console.log("[Color Map] New closest color:", color, "(kw:", kw, "at", kwIdx, ") to anchor at", aIdx, "dist:", dist);
                            }
                        });
                        
                        startIndex = kwIdx + kw.length;
                    }
                });
            }

            return bestColor;
        }

        async function classifyColorWithVLM(base64Image, useLocalAI) {
            if (!useLocalAI) {
                // Gemini Cloud VLM path
                const apiKey = document.getElementById('apiKey')?.value || '';
                let url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent';
                if (apiKey) {
                    url += `?key=${apiKey}`;
                } else {
                    url = '/api/gemini';
                }
                
                const prompt = "Describe the clothing of the person in this image. What is the dominant color?";
                
                const payload = {
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                        ]
                    }],
                    generationConfig: { temperature: 0.1 }
                };
                
                const response = await fetchWithTimeout(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }, 10000);
                
                if (!response.ok) throw new Error(`Gemini API error: ${response.status}`);
                const resJson = await response.json();
                const text = resJson.candidates[0].content.parts[0].text;
                console.log("[Color Classifier] Gemini Cloud output:", text);
                return { mappedColor: mapDescriptionToColor(text), rawText: text };
            } else {
                // Local Ollama path (supports gemma4, moondream, etc.)
                const endpoint = document.getElementById('apiEndpoint')?.value || 'http://localhost:11434';
                
                // HTTPS Mixed Content Guard: Browser blocks http://localhost from https:// Pages
                if (window.location.protocol === 'https:' && endpoint.startsWith('http:')) {
                    console.log("[AI Match] HTTPS mixed content guard: local HTTP Ollama endpoint bypassed on static HTTPS host.");
                    return { mappedColor: "白", rawText: "Static HTTPS Fallback" };
                }
                
                const cleanEndpoint = endpoint.replace(/\/v1\/?$/, '').replace(/\/$/, '');
                
                // 1. Dynamically find available model from Ollama /api/tags
                let modelName = "gemma4:e2b";
                try {
                    const tagsRes = await fetchWithTimeout(`${cleanEndpoint}/api/tags`, { method: 'GET' }, 3000);
                    if (tagsRes.ok) {
                        const tagsJson = await tagsRes.json();
                        if (tagsJson.models && tagsJson.models.length > 0) {
                            modelName = tagsJson.models[0].name || tagsJson.models[0].model || "gemma4:e2b";
                            console.log(`[Color Classifier 🦙] Detected active Ollama model: "${modelName}"`);
                        }
                    }
                } catch (e) {
                    console.warn(`[Color Classifier 🦙] Auto-detect model failed, using default: "${modelName}"`, e);
                }
                
                const url = `${cleanEndpoint}/api/generate`;
                const prompt = "Look at the clothing of the person in this image. What is the dominant color of their shirt or top? Answer with one color name (Red, Blue, Black, White, or Gray):";
                
                const payload = {
                    model: modelName,
                    prompt: prompt,
                    images: [base64Image],
                    stream: false,
                    options: {
                        temperature: 0.1,
                        num_predict: 180
                    }
                };
                
                console.log(`[Color Classifier 🦙] Sending vision classification request to ${modelName}...`);
                const response = await fetchWithTimeout(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }, 25000);
                
                if (!response.ok) throw new Error(`Local VLM error: ${response.status} (Model: ${modelName})`);
                const resJson = await response.json();
                const text = resJson.response || "";
                console.log(`[Color Classifier 🦙] Output from ${modelName}:`, text);
                return { mappedColor: mapDescriptionToColor(text), rawText: text };
            }
        }

        async function triggerSilentBackgroundMatch() {
            if (window.isVlmMatching) {
                console.log("[AI Match] VLM classification already in progress, skipping duplicate call.");
                return;
            }
            window.isVlmMatching = true;
            console.log("[AI Match] Triggering fast VLM color classification...");
            
            // Set safety defaults
            window.detectedColor = "白";
            window.aiBlessing = "岁岁平安，万事大吉";
            let rawText = "未知";
            
            try {
                const hiddenCanvas = document.createElement('canvas');
                hiddenCanvas.width = 320;
                hiddenCanvas.height = 240;
                const ctx = hiddenCanvas.getContext('2d');
                ctx.translate(hiddenCanvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(webcamElement, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
                const base64Image = hiddenCanvas.toDataURL('image/jpeg').split(',')[1];
                const useLocalAI = document.getElementById('useLocalAI')?.checked ?? true;
                
                // Call fast VLM color classification
                window.vlmPromise = classifyColorWithVLM(base64Image, useLocalAI);
                const result = await window.vlmPromise;
                window.detectedColor = result.mappedColor;
                rawText = result.rawText || "识别完成";
                console.log("[AI Match] Fast VLM mapped color:", window.detectedColor, "raw:", rawText);
            } catch (e) {
                console.log("[AI Match] Local VLM backend unreachable on static host, using color fallback ('白'):", e.message || e);
            } finally {
                window.isVlmMatching = false;
                window.vlmPromise = null;
            }

            // Immediately wake up matched figurine and update UI card details
            const matchedFigurine = matchFigurineByColor(window.detectedColor);
            window.matchedFigurineId = matchedFigurine.id;
            updateMuseumInfoCard(matchedFigurine);
            
            // Preload 0s frame image for matched color (Keep hidden until curtain reveal stage starts!)
            const stageImg = document.getElementById('stageFigurineImg');
            if (stageImg && matchedFigurine.reveal0sImage) {
                stageImg.src = matchedFigurine.reveal0sImage;
                stageImg.classList.remove('opacity-100');
                stageImg.classList.add('opacity-0');
            }
            
            const cleanDisplay = rawText.trim().replace(/[\r\n]+/g, ' ').substring(0, 40);
            updateTrackingBadge("success", `感应结果: ${window.detectedColor} ("${cleanDisplay}...")`);
        }

        /**
         * Updates the clothing mesh colors in Three.js to match the OOTD hue
         */
        function updateMannequinColorPalette(colorTag) {
            if (!avatar || !avatar.scene) return;
            
            let primaryHex = 0x2e7d32; // Default Sancai Green
            if (colorTag === "红/黄/橙") primaryHex = 0xd32f2f; // Red
            if (colorTag === "蓝/青") primaryHex = 0x1976d2; // Blue
            if (colorTag === "黑/白/灰") primaryHex = 0x455a64; // Gray
            if (colorTag === "多色/印花") primaryHex = 0x7b1fa2; // Purple
            
            avatar.scene.traverse((child) => {
                if (child.isMesh && child.material && child.userData.isClothing && !child.userData.ignorePaletteUpdate) {
                    child.material.color.setHex(primaryHex);
                }
            });
            console.log(`Mannequin clothing colors updated to matched OOTD hue: ${colorTag}`);
        }


        // ================= MOTION CAPTURE ENGINE INITIALIZATION =================

        /**
         * Instantiates the MediaPipe Motion Capture Engine
         */
        async function createMocapEngine() {
            if (mocap) {
                mocap.stop();
                mocap = null;
            }
            
            if (webcamElement.videoWidth === 0 || webcamElement.videoHeight === 0) {
                console.log("[Orchestrator] Webcam dimensions are 0x0, awaiting loadeddata...");
                await new Promise((resolve) => {
                    webcamElement.addEventListener('loadeddata', () => resolve(), { once: true });
                    setTimeout(resolve, 500); // Safety timeout
                });
            }
            
            mocap = new MotionCaptureEngine(webcamElement);
            initializeMocapCallbacks();
            mocap.start();
        }

        /**
         * Wires up callbacks for the mocap engine
         */
        function initializeMocapCallbacks() {
            if (!mocap) return;
            
            // Set default active pose key
            mocap.activePoseKey = window.currentActivePoseKey || 'optimal_1';
            
            // We don't use these score callbacks in the new cinematic flow,
            // but we keep them to prevent any null reference crashes in the engine.
            mocap.onPoseScore = function(score) {
                if (currentState === AppState.STANDBY_WAIT) {
                    updateTrackingBadge("info", `时空同频中: ${score}%`);
                }
            };
            mocap.onPoseSuccess = function(poseKey) {
                console.log(`[Mocap Callback] Pose success! PoseKey: ${poseKey}`);
                if (poseKey === 'spread_arms') {
                    if (typeof window.onUserSpin === 'function') {
                        window.onUserSpin();
                    }
                } else {
                    triggerMainDance();
                }
            };
        }

        /**
         * Synthesizes a beautiful chime sound using Web Audio API
         */
        function playChimeEffect() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
                osc.frequency.exponentialRampToValueAtTime(1318.51, ctx.currentTime + 0.3); // E6
                
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.005, ctx.currentTime + 0.55);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.6);
            } catch(e) {
                console.warn("Failed to play Web Audio chime:", e);
            }
        }
